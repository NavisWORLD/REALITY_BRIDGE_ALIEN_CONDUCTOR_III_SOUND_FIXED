name: Device target checks
on:
  push:
    paths: ['rust/**','rust-toolchain.toml','.github/workflows/device-targets.yml']
  pull_request:
    paths: ['rust/**','rust-toolchain.toml','.github/workflows/device-targets.yml']
jobs:
  ios-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios
      - run: cargo check --manifest-path rust/Cargo.toml --lib --target aarch64-apple-ios
  android-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
      - run: cargo check --manifest-path rust/Cargo.toml --lib --target aarch64-linux-android
  wasm-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - run: cargo check --manifest-path rust/Cargo.toml --lib --target wasm32-unknown-unknown
  arm-linux-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-unknown-linux-gnu
      - run: cargo check --manifest-path rust/Cargo.toml --lib --target aarch64-unknown-linux-gnu
