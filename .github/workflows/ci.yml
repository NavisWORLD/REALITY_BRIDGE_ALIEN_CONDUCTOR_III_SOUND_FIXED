name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Python tests
        run: |
          python -m pip install -e './python[test]'
          pytest -q python/tests
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Rust engine tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Rust Synaptic Core tests
        run: cargo test --manifest-path bindings/cosmic_synapse/Cargo.toml --all-targets
      - name: C++ build and tests
        run: |
          cmake -S cpp -B build/cpp -DRB_BUILD_SHARED=ON -DRB_BUILD_TESTS=ON
          cmake --build build/cpp --parallel 2
          ctest --test-dir build/cpp --output-on-failure
      - name: Reconstruct standalone HTML
        run: python tools/reconstruct_standalone.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: HTML audit
        run: node tools/audit_html.mjs
