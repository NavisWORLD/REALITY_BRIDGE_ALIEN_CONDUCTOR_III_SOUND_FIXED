name: Cross-platform engine
on:
  push:
    paths: ['python/**','rust/**','cpp/**','rust-toolchain.toml','.github/workflows/cross-platform.yml']
  pull_request:
    paths: ['python/**','rust/**','cpp/**','rust-toolchain.toml','.github/workflows/cross-platform.yml']
jobs:
  native-matrix:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Python package + tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './python[test]'
          python -m pytest -q python/tests
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: {toolchain: stable}
      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Rust release build
        shell: bash
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: C++ configure
        shell: bash
        run: cmake -S cpp -B build/cpp -DRB_BUILD_SHARED=ON -DRB_BUILD_TESTS=ON
      - name: C++ build
        shell: bash
        run: cmake --build build/cpp --config Release --parallel 2
      - name: C++ tests
        shell: bash
        run: ctest --test-dir build/cpp -C Release --output-on-failure
