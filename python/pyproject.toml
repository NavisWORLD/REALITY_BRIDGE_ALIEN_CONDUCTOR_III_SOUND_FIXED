[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-bridge"
version = "0.3.0"
description = "Host-neutral musical state, Media DNA, Synaptic Core, MIDI and native bridge for Reality Bridge Cosmic Conductor Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Cory Davis Audio / Neural Instrument Research Source Rights Reservation v1.0 - see repository LICENSE and LICENSE_HISTORY.md"}
authors = [{name="Cory Davis"}]
keywords = ["music", "midi", "generative-music", "web-audio", "dsp", "synaptic", "cosmic-conductor"]

[project.optional-dependencies]
midi = ["mido>=1.3", "python-rtmidi>=1.5"]
test = ["pytest>=8"]

[project.scripts]
reality-bridge = "reality_bridge.cli:main"
cosmic-conductor = "reality_bridge.cli:main"

[tool.setuptools]
packages = ["reality_bridge"]
